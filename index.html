<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1a1d23;--mute:#6b7280;--line:#e5e7eb;--chip:#f1f3f6;

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Inter","Hind Siliguri",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:820px;margin:0 auto;padding:22px 14px 64px}
h1{font-size:1.5rem;line-height:1.25;margin:6px 0 4px;font-weight:600;letter-spacing:.02em}
.sub{color:var(--mute);margin:0 0 16px;font-size:.92rem}
.tools{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap}
button{font:inherit;font-size:.85rem;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:2px solid var(--c2);outline-offset:2px}
summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:7px 0}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";color:var(--mute);width:1em;transition:transform .15s;flex:none;font-size:.85rem}
details[open]>summary::before{transform:rotate(90deg)}
.wk{margin-left:auto;font-family:"Fira Code",monospace;font-size:.7rem;color:var(--mute);border:1px solid var(--line);padding:1px 9px;border-radius:999px;white-space:nowrap;font-weight:400}

/* branch card */
.ph{border:1px solid var(--line);border-left:3px solid var(--k);border-radius:12px;background:var(--card);margin-bottom:10px;padding:2px 12px;overflow-x:auto;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.ph>summary{font-weight:600;font-size:1.02rem;color:var(--k)}
.tree{margin:0 0 6px 6px;padding-left:12px;border-left:1px solid var(--line)}
.node{position:relative;padding-left:12px}
.node::before,.t::before{content:"";position:absolute;left:-12px;width:12px;border-top:1px solid var(--line)}
.node::before{top:18px}
.node>details>summary{font-weight:500;color:var(--k)}
.node .node>details>summary{color:var(--ink);font-weight:400}
.t{padding:1px 0 1px 12px;position:relative;font-size:.92rem;color:var(--ink)}
.t::before{top:14px}
.note{font-size:.84rem;color:var(--mute);margin:0 0 6px 20px}

/* prerequisite / related block */
.rel{margin:2px 0 8px 20px;display:grid;gap:5px}
.rr{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.rl{font-size:.74rem;color:var(--mute);min-width:84px}
.none{font-size:.78rem;color:var(--mute)}
.chip{font:inherit;font-size:.76rem;padding:1px 10px;border:1px solid var(--k,var(--line));color:var(--k,var(--ink));background:transparent;border-radius:999px;cursor:pointer}
.chip.ghost{--k:var(--mute)}
.flash{animation:fl 1.6s ease-out}
@keyframes fl{0%{background:rgba(37,99,235,.14)}100%{background:transparent}}

/* prerequisite map */
.map{border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:14px;padding:2px 12px 12px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.map>summary{font-weight:600;font-size:1.02rem}
.hint{font-size:.82rem;color:var(--mute);margin:0 0 8px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin:0 0 8px;font-size:.76rem;color:var(--mute)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:baseline}
.mapwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:6px}
.mapwrap svg{display:block;max-width:none}
.mn{cursor:pointer;transition:opacity .15s}
.mn rect.bx{fill:var(--card);stroke:var(--k);stroke-width:1}
.mn rect.bar{fill:var(--k)}
.mn text.mt{fill:var(--ink);font:500 11px Inter,"Hind Siliguri",sans-serif}
.mn text.mw{fill:var(--mute);font:400 9px "Hind Siliguri",sans-serif}
.mn.sel rect.bx{stroke-width:2.2}
.mn.dim{opacity:.2}
.ed{fill:none;stroke:var(--k);stroke-width:1.1;opacity:.35;transition:opacity .15s}
.ed.on{opacity:.95;stroke-width:1.9}
.ed.dim{opacity:.06}
.panel{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;display:grid;gap:6px}
.pn-t{display:flex;align-items:center;gap:8px}
.pn-t b{color:var(--k);font-weight:600}
.pn-r{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.pn-r i{font-style:normal;color:var(--mute);font-size:.8rem}
.cur{font-size:.8rem;font-weight:600;color:var(--k)}
</style>

function nm(t){var s=t.replace(/^[A-Z]\.\s*/,"").replace(/⭐/g,"").trim();return s.charAt(0)+s.slice(1).toLowerCase()}

var root=document.getElementById("root"),out="",inS=false,inG=false,first=true,NK={},ORD=[],curC=0;
function leaves(a){return a.split(",").map(function(t){return '<div class="t">'+t+'</div>'}).join("")}
function closeG(){if(inG){out+='</div></details></div>';inG=false}}
function closeS(){closeG();if(inS){out+='</div></details></div>';inS=false}}
function closeP(){closeS();if(!first)out+='</div></details>'}
RAW.split("\n").forEach(function(l){var p=l.split("|"),t=p[0];
 if(t==="P"){closeP();curC=p[3];out+='<details class="ph" style="--k:var(--c'+p[3]+')"'+(first?' open':'')+'><summary>'+p[1]+'<span class="wk">'+p[2]+'</span></summary><div class="tree">';first=false}
 else if(t==="S"){closeS();var k=p[4]||"";if(k){NK[k]={k:k,name:LBL[k]||nm(p[1]),wk:p[2],c:curC};ORD.push(k)}
  out+='<div class="node"'+(k?' id="n-'+k+'" style="--k:var(--c'+curC+')"':'')+'><details><summary>'+p[1]+'<span class="wk">'+p[2]+'</span></summary>'+(p[3]?'<div class="note">'+p[3]+'</div>':'')+(k?'<div class="rel" data-r="'+k+'"></div>':'')+'<div class="tree">';inS=true}
 else if(t==="G"){closeG();out+='<div class="node"><details><summary>'+p[1]+(p[2]&&p[2]!==p[1]?'<span class="wk">'+p[2]+'</span>':'')+'</summary><div class="tree">'+leaves(p[3]);inG=true}
 else if(t==="L"){out+=leaves(p[1])}});
closeP();root.innerHTML=out;

// ---- graph data ----
var DOWN={},RL={},LV={};
ORD.forEach(function(k){DOWN[k]=[];RL[k]=[]});
ORD.forEach(function(k){(PRE[k]||[]).forEach(function(p){DOWN[p].push(k)})});
Object.keys(REL).forEach(function(a){REL[a].forEach(function(b){if(RL[a].indexOf(b)<0)RL[a].push(b);if(RL[b].indexOf(a)<0)RL[b].push(a)})});
function lv(k){if(LV[k]!=null)return LV[k];var m=-1;(PRE[k]||[]).forEach(function(p){m=Math.max(m,lv(p))});return LV[k]=m+1}
ORD.forEach(lv);
function chips(a,attr){return a.map(function(k){return '<button class="chip" '+(attr||'data-go')+'="'+k+'" style="--k:var(--c'+NK[k].c+')">'+NK[k].name+'</button>'}).join("")}

// ---- prerequisite / related block inside each topic ----
document.querySelectorAll(".rel").forEach(function(el){var k=el.getAttribute("data-r"),pre=PRE[k]||[],nx=DOWN[k]||[],
 rel=(RL[k]||[]).filter(function(x){return pre.indexOf(x)<0&&nx.indexOf(x)<0}),h='';
 h+='<div class="rr"><span class="rl">আগে শিখুন</span>'+(pre.length?chips(pre):'<span class="none">কিছু নেই — এখান থেকেই শুরু</span>')+'</div>';
 if(nx.length)h+='<div class="rr"><span class="rl">এরপর শিখুন</span>'+chips(nx)+'</div>';
 if(rel.length)h+='<div class="rr"><span class="rl">সম্পর্কিত</span>'+chips(rel)+'</div>';
 h+='<div class="rr"><button class="chip ghost" data-map="'+k+'">map-এ দেখুন ↑</button></div>';
 el.innerHTML=h});

// ---- prerequisite map (SVG) ----
var W=136,H=38,PX=176,PY=48,cols={},X={},Y={};
ORD.forEach(function(k){(cols[LV[k]]=cols[LV[k]]||[]).push(k)});
function bc(k){var s=0,n=0;(PRE[k]||[]).forEach(function(p){s+=Y[p];n++});return n?s/n:0}
var levels=Object.keys(cols).map(Number).sort(function(a,b){return a-b}),maxRows=0;
levels.forEach(function(l){var a=cols[l];if(l>0)a.sort(function(x,y){return bc(x)-bc(y)});a.forEach(function(k,i){X[k]=16+l*PX;Y[k]=i});maxRows=Math.max(maxRows,a.length)});
var SW=16+levels.length*PX,SH=maxRows*PY+24;
function yy(k){return 12+Y[k]*PY}
var svg='<svg width="'+SW+'" height="'+SH+'" viewBox="0 0 '+SW+' '+SH+'" xmlns="http://www.w3.org/2000/svg">';
ORD.forEach(function(k){(PRE[k]||[]).forEach(function(p){var x1=X[p]+W,y1=yy(p)+H/2,x2=X[k],y2=yy(k)+H/2;
 svg+='<path class="ed" data-a="'+p+'" data-b="'+k+'" style="--k:var(--c'+NK[p].c+')" d="M'+x1+','+y1+' C'+(x1+36)+','+y1+' '+(x2-36)+','+y2+' '+x2+','+y2+'"/>'})});
ORD.forEach(function(k){var n=NK[k];
 svg+='<g class="mn" data-sel="'+k+'" style="--k:var(--c'+n.c+')" transform="translate('+X[k]+','+yy(k)+')"><rect class="bx" width="'+W+'" height="'+H+'" rx="8"/><rect class="bar" x="0" y="8" width="3" height="'+(H-16)+'" rx="1.5"/><text class="mt" x="12" y="16">'+n.name+'</text><text class="mw" x="12" y="30">'+n.wk+'</text></g>'});
svg+='</svg>';
document.getElementById("mapw").innerHTML=svg;
document.getElementById("lg").innerHTML=[[0,"Foundation"],[1,"Discrete"],[2,"Calculus"],[3,"Linear Algebra"],[4,"Probability"],[6,"Advanced"]].map(function(x){return '<span><i style="background:var(--c'+x[0]+')"></i>'+x[1]+'</span>'}).join("");

function sel(k){
 var anc={},desc={};
 (function a(x){(PRE[x]||[]).forEach(function(p){if(!anc[p]){anc[p]=1;a(p)}})})(k);
 (function d(x){DOWN[x].forEach(function(q){if(!desc[q]){desc[q]=1;d(q)}})})(k);
 document.querySelectorAll(".mn").forEach(function(g){var id=g.getAttribute("data-sel");g.setAttribute("class","mn"+(id===k?" sel":(anc[id]||desc[id])?"":" dim"))});
 document.querySelectorAll(".ed").forEach(function(e){var a=e.getAttribute("data-a"),b=e.getAttribute("data-b"),
  up=(a===k||anc[a])&&(b===k||anc[b]),dn=(a===k||desc[a])&&(b===k||desc[b]);
  e.setAttribute("class","ed"+((up||dn)?" on":" dim"))});
 var n=NK[k],list=Object.keys(anc).sort(function(a,b){return LV[a]-LV[b]||ORD.indexOf(a)-ORD.indexOf(b)}),h='';
 h+='<div class="pn-t" style="--k:var(--c'+n.c+')"><b>'+n.name+'</b><span class="wk">'+n.wk+'</span></div>';
 h+='<div class="pn-r"><span class="rl">শেখার ক্রম</span>';
 if(list.length){var prev=-1;list.forEach(function(x,i){if(i)h+='<i>'+(LV[x]===prev?'·':'→')+'</i>';prev=LV[x];h+=chips([x])});h+='<i>→</i><span class="cur">'+n.name+'</span>'}
 else h+='<span class="none">এটাই শুরু — আগে কিছু লাগবে না</span>';
 h+='</div>';
 if(DOWN[k].length)h+='<div class="pn-r"><span class="rl">এরপর খুলবে</span>'+chips(DOWN[k])+'</div>';
 h+='<div class="pn-r"><button class="chip ghost" data-go="'+k+'">রোডম্যাপে খুলুন ↓</button></div>';
 document.getElementById("pn").innerHTML=h}

function goTo(k){var el=document.getElementById("n-"+k);if(!el)return;
 var a=el;while((a=a.parentNode)&&a!==document.body){if(a.tagName==="DETAILS")a.open=true}
 var d=el.querySelector("details");if(d)d.open=true;
 el.scrollIntoView({behavior:"smooth",block:"start"});el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash")}

document.addEventListener("click",function(e){var t=e.target,m=t.closest?t.closest("[data-sel],[data-go],[data-map]"):null;if(!m)return;
 if(m.hasAttribute("data-sel"))sel(m.getAttribute("data-sel"));
 else if(m.hasAttribute("data-go"))goTo(m.getAttribute("data-go"));
 else if(m.hasAttribute("data-map")){sel(m.getAttribute("data-map"));var md=document.getElementById("mapd");md.open=true;md.scrollIntoView({behavior:"smooth",block:"start"})}});

var $=function(i){return document.getElementById(i)};
$("ex").onclick=function(){document.querySelectorAll("#root details").forEach(function(x){x.open=true})};
$("co").onclick=function(){document.querySelectorAll("#root details").forEach(function(x){x.open=false})};
$("th").onclick=function(){var r=document.documentElement;r.dataset.theme=r.dataset.theme==="dark"?"light":"dark"};
sel("der");
</script>
</body>
